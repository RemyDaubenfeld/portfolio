vich_uploader:
    db_driver: orm

    mappings:
        media:
            uri_prefix: /assets/img
            upload_destination: '%kernel.project_dir%/public/assets/img'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        documents:
            uri_prefix: /dl
            upload_destination: '%kernel.project_dir%/public/dl'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        chatbot_icon:
            uri_prefix: /uploads/chatbot
            upload_destination: '%kernel.project_dir%/public/uploads/chatbot'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
