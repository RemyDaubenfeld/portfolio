name: Deploy to IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Récupération du code ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup PHP ─────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo, pdo_mysql, zip, opcache
          coverage: none

      # ── 3. Cache Composer ─────────────────────────────────────────────────
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor/
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # ── 4. Install PHP dependencies (prod only) ───────────────────────────
      - name: Composer install (prod)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
        env:
          APP_ENV: prod

      # ── 5. Setup SSH ──────────────────────────────────────────────────────
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── 6. Nettoyage avant envoi ──────────────────────────────────────────
      - name: Clean up before deploy
        run: |
          rm -rf .git .github node_modules tests
          rm -f .gitignore .env.local .env.test
          rm -rf var/cache/*
       
      # ── 7. Build Tailwind CSS ──────────────────────────────────────────
      - name: Build Tailwind CSS
        run: php bin/console tailwind:build --minify
        env:
          APP_ENV: prod

      # ── 8. Déploiement via rsync ──────────────────────────────────────────
      - name: Deploy via rsync
        run: |
          rsync -az --delete \
          --exclude='.env.local' \
          --exclude='var/log/' \
          --exclude='public/uploads/' \
          --exclude='public/assets/img/' \
          -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/www/portfolio/

      # ── 9. Post-deploy : tailwind + assets + cache + migrations ───────────
      - name: Post-deploy commands (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 22
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/www/portfolio
            php bin/console asset-map:compile
            php bin/console cache:clear --env=prod --no-debug
            php bin/console cache:warmup --env=prod
            php bin/console doctrine:migrations:migrate --no-interaction --env=prod